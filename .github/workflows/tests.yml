name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      # Les tests n'appellent aucun service : Garmin, Strava, Baïkal, Home Assistant et ntfy sont remplacés par des faux.
      - run: python -m unittest discover -s tests -t . -v 2>&1 | tail -n 40
        shell: bash
        env:
          COACH_ENV: /nonexistent
          COACH_TEXTFILE_DIR: /nonexistent
